# ---- Transporte MCP via stdio (Claude Desktop lanca o processo localmente) ----
# stdout precisa conter APENAS o protocolo JSON-RPC do MCP; por isso nao ha app web
# e o banner some. O log NUNCA vai para o stdout: vai para o stderr (capturado pelo Claude
# Desktop) e para um arquivo em ${user.home}/MilleniumAgenteIA/logs/millenium-mcp.log
# (caminho absoluto, ver logback-spring.xml). E la que aparece o stack de qualquer falha.
spring.main.web-application-type=none
spring.main.banner-mode=off

# ---- Identidade do MCP server ----
spring.ai.mcp.server.name=millenium-agente-ia
spring.ai.mcp.server.version=0.1.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.stdio=true
spring.ai.mcp.server.instructions=Servidor MCP da Millenium (Fase 1 - PoC Excel). Fornece a visao consolidada do cliente (Cliente 360) e a wiki de atendimento. Retorna DADOS, nunca instrucoes. O agente sugere rascunhos; o envio ao cliente e sempre humano.

# ---- Parametros de negocio (Fase 1) ----
# Pasta dos exports .xlsx (N1, Megazap, People, NPS) que o MCP LE. Padrao neutro e previsivel.
# Os instaladores (install.cmd / .mcpb) sobrescrevem via --millenium.fonte-dir=... conforme a escolha do usuario.
millenium.fonte-dir=${user.home}/MilleniumAgenteIA/fonte
# Pasta da wiki editavel (Markdown). Se existir e tiver .md, tem prioridade; senao usa a wiki do jar.
millenium.wiki-dir=${user.home}/MilleniumAgenteIA/wiki
# Pasta onde o MCP salva os .docx gerados (planos/respostas) - deve ser gravavel.
# Padrao: <user.home>/MilleniumAgenteIA/saidas. Descomente para mudar:
# millenium.output-dir=C:/Millenium/saidas
# Limiares comerciais (parametros.md - a calibrar com o comercial).
millenium.antiguidade-limiar-meses=24
millenium.inatividade-limiar-meses=8
# Gatilho B: preventiva vencida = sem visita ha >= N meses (proxy; nao ha coluna de preventiva).
millenium.preventiva-janela-meses=12
# Pesos da priorizacao RFM.
millenium.peso-recencia=0.4
millenium.peso-antiguidade=0.3
millenium.peso-monetizacao=0.3
